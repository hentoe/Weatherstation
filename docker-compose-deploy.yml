services:
  app:
    build:
      context: .
    restart: always
    volumes:
      - static-data:/vol/web
    env_file:
      - ./.env
    depends_on:
      - db

  db:
    image: postgres:18.6-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}

  proxy:
    build:
      context: ./docker/proxy
    restart: always
    depends_on:
      - app
    ports:
      - "${BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - static-data:/vol/static
      - certbot-web:/vol/www
      - proxy-dhparams:/vol/proxy
      - certbot-certs:/etc/letsencrypt
    environment:
      - SSL=${SSL}
      - DOMAIN=${DOMAIN}

  certbot:
    build:
      context: ./docker/certbot
    command: echo "Skipping..."
    environment:
      - EMAIL=${ACME_DEFAULT_EMAIL}
      - DOMAIN=${DOMAIN}
    volumes:
      - certbot-web:/vol/www
      - certbot-certs:/etc/letsencrypt/
    depends_on:
      - proxy

volumes:
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME}
  static-data:
  certbot-web:
  proxy-dhparams:
  certbot-certs:
